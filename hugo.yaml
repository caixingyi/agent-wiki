baseURL: "https://agentwiki.top/"
title: "Agent Wiki"
defaultContentLanguage: zh-cn

enableRobotsTXT: true
enableGitInfo: false

module:
  imports:
    - path: github.com/imfing/hextra

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: 资源
      pageRef: /resources
      weight: 1
    - name: 面经
      pageRef: /interview
      weight: 2
    - name: 项目
      pageRef: /projects
      weight: 3
    - name: 他山之石
      pageRef: /learning-paths
      weight: 4
    - name: 社区
      pageRef: /community
      weight: 5
    - name: 贡献者
      pageRef: /contributors
      weight: 6
    - name: 搜索
      weight: 7
      params:
        type: search
    - name: GitHub
      weight: 8
      url: "https://github.com/caixingyi/agent-wiki"
      params:
        icon: github

params:
  description: "AI Agent 开发资源、面试题库与开发者社区"

  navbar:
    displayTitle: true
    displayLogo: false

  page:
    width: wide

  footer:
    displayCopyright: true
    displayPoweredBy: false

  comments:
    enable: true
    type: giscus
    giscus:
      repo: caixingyi/agent-wiki
      repoId: R_kgDOSZ8FKg
      category: Announcements
      categoryId: DIC_kwDOSZ8FKs4C8w-L
      mapping: pathname
      strict: 1
      reactionsEnabled: 1
      emitMetadata: 0
      inputPosition: bottom
      lang: zh-CN

  editURL:
    enable: true
    base: "https://github.com/caixingyi/agent-wiki/edit/main/content"
